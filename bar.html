<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>통합 프롬프트 바</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    height: 100vh; padding: 12px 16px; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #12141f, #1c1f33); color: #e8eaf6;
    display: flex; flex-direction: column; gap: 8px;
  }
  .row { display: flex; gap: 10px; align-items: stretch; flex: 1; min-height: 0; }
  textarea {
    flex: 1; resize: none; padding: 10px 14px; font-size: 15px; color: #fff;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus { border-color: #7c8cff; box-shadow: 0 0 0 3px rgba(124,140,255,.25); }
  button {
    border: 0; border-radius: 12px; padding: 0 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #fff; transition: transform .15s, filter .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.15); }
  #send { background: linear-gradient(135deg, #6c7bff, #a266ff); font-size: 15px; padding: 0 22px; }
  #new, #reset, #move, #min, #close { background: rgba(255,255,255,.12); }
  #close { padding: 0 16px; font-size: 16px; font-weight: 700; }
  #close:hover { background: rgba(255, 75, 75, 0.6); }
  .meta { display: flex; gap: 16px; align-items: center; font-size: 13px; }
  label { cursor: pointer; display: flex; gap: 5px; align-items: center; }
  #status { margin-left: auto; color: #9fa8da; }
</style>
</head>
<body>
  <div class="row">
    <textarea id="prompt" placeholder="모든 LLM에 보낼 프롬프트를 입력하세요  (Enter: 전송 / Shift+Enter: 줄바꿈)" autofocus></textarea>
    <button id="send" title="모든 LLM에 프롬프트 전송 (Enter)">전송 ▶</button>
    <button id="new" title="새 대화 시작">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        <text x="12" y="11" font-size="7" font-weight="900" text-anchor="middle" fill="currentColor" stroke="none" dy=".35em">NEW</text>
      </svg>
    </button>
    <button id="reset" title="3분할 원래 위치로 복귀">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
        <line x1="15" y1="3" x2="15" y2="21"></line>
      </svg>
    </button>
    <button id="move" title="다음 모니터로 이동">
      <span style="font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 5px;">
        A
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        B
      </span>
    </button>
    <button id="min" title="모든 LLM 창과 입력창을 함께 작업표시줄로 내립니다">창 내리기 ─</button>
    <button id="close" title="모든 LLM 창과 앱을 완전히 닫습니다">✕</button>
  </div>
  <div class="meta">
    <label><input type="checkbox" class="t" checked> ChatGPT</label>
    <label><input type="checkbox" class="t" checked> Gemini</label>
    <label><input type="checkbox" class="t" checked> Claude</label>
    <span id="status"></span>
  </div>
<script>
  const $ = id => document.getElementById(id);
  async function go() {
    const text = $('prompt').value.trim();
    if (!text) return;
    const targets = [...document.querySelectorAll('.t')].map(c => c.checked);
    $('status').textContent = '전송 중...';
    const r = await window.api.send(text, targets);
    const fail = Object.entries(r).filter(([, ok]) => !ok).map(([n]) => n);
    $('status').textContent = fail.length ? `실패: ${fail.join(', ')} (로그인/입력창 확인)` : '전송 완료 ✔';
    if (!fail.length) $('prompt').value = '';
    $('prompt').focus();
  }
  $('send').onclick = go;
  $('new').onclick = () => window.api.newChat();
  $('reset').onclick = async () => { await window.api.resetLayout(); $('status').textContent = '3분할로 복귀했습니다'; };
  $('move').onclick = async () => { await window.api.moveMonitor(); $('status').textContent = '모니터로 이동했습니다'; };
  $('min').onclick = async () => { await window.api.minimizeAll(); };
  $('close').onclick = async () => { await window.api.closeAll(); };
  $('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(); }
  });
</script>
</body>
</html>
